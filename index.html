<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>The Lola Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6ee;--card:#fff;--ink:#4a3a33;--soft:#8a7468;--rose:#e8857a;--rose2:#f6c9bf;--sage:#7fb39a;--sage2:#dcefe4;--bad:#d96a5f;--bad2:#fbe2de;--gold:#f2b84b}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);font-size:20px;line-height:1.45;min-height:100vh;
background:radial-gradient(circle at 10% 0%,#ffe6da 0,transparent 45%),radial-gradient(circle at 100% 100%,#e4f2ea 0,transparent 45%),var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 48px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:.2em 0}h1{font-size:2.1rem;text-align:center}h2{font-size:1.45rem;line-height:1.3}
.sub{text-align:center;color:var(--soft);margin:0 0 20px}.emoji{font-size:3rem;text-align:center}
.card{background:var(--card);border-radius:26px;padding:24px 20px;box-shadow:0 10px 30px rgba(120,80,60,.12);animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
input{width:100%;font:inherit;font-size:1.2rem;padding:16px 18px;border-radius:16px;border:2px solid var(--rose2);margin:10px 0;outline:none}input:focus{border-color:var(--rose)}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:18px;width:100%;padding:18px;font-size:1.15rem;min-height:60px;transition:transform .1s,background .2s}
button:active{transform:scale(.98)}.primary{background:var(--rose);color:#fff;box-shadow:0 6px 0 #c9665c}.primary:active{box-shadow:0 2px 0 #c9665c;transform:translateY(4px)}
.opt{display:block;text-align:left;background:#fff7f2;color:var(--ink);border:2px solid var(--rose2);margin:12px 0;font-weight:700}
.opt.right{background:var(--sage2);border-color:var(--sage)}.opt.wrong{background:var(--bad2);border-color:var(--bad);animation:shake .3s}.opt:disabled{cursor:default}
.bar{height:14px;background:#f3e3d8;border-radius:99px;overflow:hidden;margin:6px 0 16px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:99px;transition:width .5s}
.meta{display:flex;justify-content:space-between;color:var(--soft);font-weight:700;font-size:1rem}
.fb{border-radius:18px;padding:16px;margin:14px 0;animation:pop .3s}.fb.ok{background:var(--sage2)}.fb.no{background:var(--bad2)}.fb b{font-size:1.2rem}
.err{color:var(--bad);font-weight:700;min-height:1.4em}.score{font-family:Fraunces,serif;font-size:3.6rem;text-align:center;color:var(--rose);margin:0}
.miss{background:#fff7f2;border-radius:16px;padding:14px;margin:10px 0;font-size:1.05rem}.miss .ca{color:#3f7f61;font-weight:800}
.hidden{display:none}
</style></head><body><div class="wrap">
<div class="emoji">🍼🧸</div><h1>The Lola Quiz</h1><p class="sub">How well do you know Lola's routine?</p>
<div id="app"></div></div>
<script src="data.js"></script>
<script>
const app=document.getElementById('app');let Q=[],i=0,score=0,missed=[];
const enc=new TextEncoder(),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function decrypt(pw){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(QDATA.s),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(QDATA.i)},key,b64(QDATA.c))))}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gate(){app.innerHTML=`<div class="card"><h2>Welcome, Grandma & Grandpa! 💛</h2><p>Enter the password to start.</p>
<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><div class="err" id="err"></div><button class="primary">Let's go</button></form></div>`;
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value.trim().toLowerCase();
if(await sha(pw)!==PWHASH){const c=app.firstChild;document.getElementById('err').textContent='Hmm, not quite. Try again!';c.style.animation='none';c.offsetWidth;c.style.animation='shake .3s';return}
localStorage.setItem('lolaPw',pw);start(pw)}}
async function start(pw){try{Q=await decrypt(pw)}catch(e){localStorage.removeItem('lolaPw');return gate()}intro()}
function intro(){app.innerHTML=`<div class="card"><h2>Ready?</h2><p>${Q.length} quick questions from Diana's guide, <i>Bringing Up Lola</i>. Tap your answer and you'll see right away if you got it.</p><p>No pressure, you can retake it as many times as you like! 😊</p><button class="primary" onclick="i=0;score=0;missed=[];show()">Start the quiz</button></div>`}
function show(){const o=Q[i];if(o.a.length>2&&!o._s){const ix=o.a.map((_,k)=>k).sort(()=>Math.random()-.5);o.a=ix.map(k=>o.a[k]);o.c=ix.indexOf(o.c)}const q=Q[i];app.innerHTML=`<div class="card"><div class="meta"><span>Question ${i+1} of ${Q.length}</span><span>⭐ ${score}</span></div>
<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><h2>${esc(q.q)}</h2><div id="opts">${q.a.map((a,j)=>`<button class="opt" data-j="${j}">${esc(a)}</button>`).join('')}</div><div id="fb"></div></div>`;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j));window.scrollTo({top:0,behavior:'smooth'})}
function answer(j){const q=Q[i],ok=j===q.c,bs=document.querySelectorAll('.opt');bs.forEach(b=>b.disabled=true);bs[q.c].classList.add('right');if(!ok){bs[j].classList.add('wrong');missed.push(q)}else score++;
document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'🎉 That\'s right!':'Not quite.'}</b> ${ok?'':'The answer is <b>'+esc(q.a[q.c])+'</b>.'}<p style="margin:.5em 0 0">📖 ${esc(q.e)}</p></div>
<button class="primary" onclick="next()">${i+1<Q.length?'Next question':'See my score'}</button>`;document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){i++;i<Q.length?show():end()}
function end(){const p=score/Q.length,msg=p===1?'Perfect! Lola is in great hands! 🏆':p>=.8?'Wonderful job! 🌟':p>=.6?'Nice work! Just a few to review. 💛':'Good start! Give it another read and try again. 📖';
app.innerHTML=`<div class="card"><h2 style="text-align:center">All done!</h2><p class="score">${score}/${Q.length}</p><p style="text-align:center;font-weight:700">${msg}</p>
${missed.length?'<h2>Ones to review</h2>'+missed.map(q=>`<div class="miss"><div><b>${esc(q.q)}</b></div><div class="ca">✓ ${esc(q.a[q.c])}</div><div>📖 ${esc(q.e)}</div></div>`).join(''):''}
<button class="primary" style="margin-top:16px" onclick="i=0;score=0;missed=[];Q.forEach(q=>q._s=0);show()">Take it again</button></div>`;window.scrollTo({top:0,behavior:'smooth'})}
const saved=localStorage.getItem('lolaPw');saved?start(saved):gate();
</script></body></html>
